name: CI

on:
  push:
    branches: [master]
  pull_request:
  # O release.yml chama esta mesma suíte, para a matriz do gate nunca divergir da do CI.
  workflow_call:

permissions:
  contents: read

# Um push novo no mesmo ref torna a execução anterior irrelevante.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test
